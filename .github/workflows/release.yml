name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module.json version
        run: |
          VERSION=$(jq -r .version module.json)
          [ "${{ github.event.release.tag_name }}" = "v$VERSION" ] || { echo "Tag ${{ github.event.release.tag_name }} != v$VERSION"; exit 1; }

      - name: Build and upload
        run: |
          zip -r module.zip module.json LICENSE README.md scripts
          gh release upload "${{ github.event.release.tag_name }}" module.json module.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
